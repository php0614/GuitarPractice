<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>[Music] Guitar Practice</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: #1A1A2E; color: #E0E0E0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 13px; overflow-x: hidden; }
.app {
  min-height: 100vh; min-height: 100dvh; padding: 5px; gap: 4px;
  max-width: 430px; margin: 0 auto;
}
.app.layout-vertical { display: flex; flex-direction: column; }
.app.layout-horizontal {
  display: grid;
  grid-template-columns: minmax(280px, 0.95fr) minmax(300px, 1fr) minmax(420px, 1.25fr);
  grid-template-areas:
    "fret fret fret"
    "topStack practiceHeader sequencerHeader"
    "topStack practice sequencer"
    "topStack practice sequencer"
    "cloudHeader calendarHeader drums"
    "cloud calendar drums"
    "cloud calendar presetsHeader"
    "cloud calendar presets"
    "cloud calendar settingsHeader"
    "cloud calendar settings";
  align-items: start;
  width: min(1240px, calc(100vw - 12px));
  max-width: min(1240px, calc(100vw - 12px));
  gap: 6px;
}
.top-practice-stack { display: flex; flex-direction: column; gap: 4px; }
.app.layout-horizontal .top-practice-stack { grid-area: topStack; gap: 2px; }
.app.layout-horizontal .fret-panel { grid-area: fret; }
.app.layout-horizontal [data-section="practice"] { grid-area: practiceHeader; }
.app.layout-horizontal #practiceSection { grid-area: practice; }
.app.layout-horizontal [data-section="sequencer"] { grid-area: sequencerHeader; }
.app.layout-horizontal #sequencerSection { grid-area: sequencer; }
.app.layout-horizontal .drum-vol-block { grid-area: drums; }
.app.layout-horizontal [data-section="presets"] { grid-area: presetsHeader; }
.app.layout-horizontal #presetsSection { grid-area: presets; }
.app.layout-horizontal [data-section="settings"] { grid-area: settingsHeader; }
.app.layout-horizontal #settingsSection { grid-area: settings; }
.app.layout-horizontal [data-section="practiceCalendar"] { grid-area: calendarHeader; }
.app.layout-horizontal #practiceCalendarSection { grid-area: calendar; }
.app.layout-horizontal [data-section="cloud"] { grid-area: cloudHeader; }
.app.layout-horizontal #cloudSection { grid-area: cloud; }
@media (min-width: 821px) {
  .app.layout-horizontal {
    row-gap: 0;
    column-gap: 6px;
  }
  .app.layout-horizontal .fret-panel {
    margin-bottom: 4px;
  }
  .app.layout-horizontal .inner-section {
    padding-top: 0;
    padding-bottom: 3px;
  }
  .app.layout-horizontal .section-body:not(.collapsed) {
    margin-top: -3px;
  }
  .app.layout-horizontal.presets-collapsed [data-section="settings"] {
    grid-area: presets;
    position: relative;
    z-index: 1;
  }
  .app.layout-horizontal.presets-collapsed #settingsSection {
    grid-area: settingsHeader;
  }
}
@media (max-width: 820px) {
  .app.layout-horizontal {
    display: flex;
    flex-direction: column;
    max-width: 430px;
  }
}

/* ── Collapsible Sections ─────────────────────────── */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  background: #252545; border-radius: 8px; padding: 6px 12px; cursor: pointer;
  font-weight: bold; font-size: 13px; color: #E0E0E0; user-select: none;
}
.section-title { display: flex; align-items: center; gap: 7px; }
.section-icon { color: #FFD700; width: 16px; display: inline-flex; justify-content: center; font-size: 12px; }
.section-header .arrow { transition: transform 0.2s; font-size: 10px; }
.section-header.collapsed .arrow { transform: rotate(-90deg); }
.section-body { overflow: hidden; transition: max-height 0.3s ease; }
.section-body.collapsed { max-height: 0 !important; }

/* ── Practice Display (always visible, top) ────────── */
.display-frame {
  background: #12122A; border: 2px solid #333; border-radius: 12px;
  min-height: 106px; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 5px 8px; flex-shrink: 0;
}
.app.layout-horizontal .display-frame { min-height: 252px; }
.note-display { color: #FFD700; font-size: 42px; font-weight: bold; line-height: 1.1; }
.extra-display { color: #00CED1; font-size: 16px; font-weight: bold; margin-top: 2px; }
.status-display { color: #888; font-size: 14px; margin-top: 6px; }

/* ── Staff / Rhythm Notation ─────────────────────── */
.display-content { display: flex; align-items: center; gap: 16px; justify-content: center; flex-wrap: wrap; }
.note-text-col { display: flex; flex-direction: column; align-items: center; }
#staffCanvas { flex-shrink: 0; }
#rhythmCanvas { display: none; margin-top: 4px; max-width: 100%; }
.rhythm-on #rhythmCanvas { display: block; }

/* ── Fretboard ───────────────────────────────────── */
.fret-panel {
  background: #12122A; border: 2px solid #333; border-radius: 12px;
  padding: 5px; flex-shrink: 0; position: relative;
}
.app.layout-horizontal .fret-panel { align-self: stretch; padding: 6px; }
#fretCanvas { width: 100%; display: block; border-radius: 6px; }
.fret-options { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.fret-options label { color: #CCC; font-size: 12px; }
#tuningNotes { color: #8888AA; font-size: 11px; letter-spacing: 1px; }
.fret-legend { display: flex; gap: 10px; font-size: 10px; color: #999; align-items: center; margin-left: auto; }
.legend-dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; margin-right: 3px; vertical-align: -2px; }
.legend-diamond { width: 9px; height: 9px; display: inline-block; margin-right: 4px; transform: rotate(45deg); vertical-align: -1px; }

/* ── Mode Buttons ────────────────────────────────── */
.mode-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mode-btn {
  background: #2A2A3E; color: #E0E0E0; border: 2px solid #555; border-radius: 8px;
  font-size: 11px; font-weight: bold; height: 30px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
}
.btn-icon { display: inline-flex; align-items: center; justify-content: center; width: 14px; color: currentColor; font-size: 12px; }
.mode-btn:active { background: #3A3A5E; }
.mode-btn.active { background: #3A2A1E; border-color: #FF6B35; color: #FFD700; }

/* ── Slider Rows ─────────────────────────────────── */
.slider-row { display: flex; align-items: center; gap: 8px; }
.slider-row label { font-size: 12px; white-space: nowrap; min-width: 55px; color: #CCC; }
.slider-row input[type="range"] { flex: 1; height: 6px; accent-color: #FF6B35; }
.slider-row .val { width: 30px; text-align: center; font-size: 12px; }

/* ── Control Rows ────────────────────────────────── */
.control-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.control-row label { color: #CCC; font-size: 12px; }
input[type="number"] {
  background: #2A2A3E; color: #E0E0E0; border: 1px solid #555; border-radius: 6px;
  padding: 4px 6px; font-size: 13px; width: 64px; height: 30px;
}
select {
  background: #2A2A3E; color: #E0E0E0; border: 1px solid #555; border-radius: 6px;
  padding: 4px; font-size: 13px; height: 30px;
}
.checkbox-label { display: flex; align-items: center; gap: 4px; color: #CCC; font-size: 12px; cursor: pointer; }
.checkbox-label input[type="checkbox"] { accent-color: #FF6B35; width: 18px; height: 18px; }
.practice-controls { display: flex; flex-direction: column; gap: 5px; padding: 0 12px; }
.practice-control-row { display: flex; align-items: center; gap: 5px; width: 100%; }
.control-spacer { flex: 1 1 auto; min-width: 0; }
.chip-control,
.lock-btn {
  height: 28px; background: #2A2A3E; border: 1px solid #555; color: #E0E0E0;
  border-radius: 7px; font-size: 10px; font-weight: bold; cursor: pointer;
  padding: 0 7px; line-height: 1; white-space: nowrap;
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
}
.chip-control { width: 82px; }
.chip-control input[type="checkbox"] { position: absolute; opacity: 0; pointer-events: none; }
.rhythm-chip { width: 82px; }
.rhythm-chip select,
.root-chip select {
  border: 0; background: transparent; color: inherit; padding: 0; height: 24px;
  font-size: 10px; font-weight: bold; max-width: 48px;
}
.root-chip { width: 82px; }
.lock-btn {
  margin-left: 0;
}
.lock-btn:active { background: #3A3A5E; }
.lock-btn.active { background: #3A2A1E; border-color: #FF6B35; color: #FFD700; }
#lockBtn { width: 60px; }
#arpLockBtn { width: 45px; }
#rootLockBtn { width: 50px; }
.layout-toggle-btn { width: 64px; }
.arp-slot { width: 45px; height: 28px; flex: 0 0 45px; }
.root-slot { width: 52.5px; height: 28px; flex: 0 0 52.5px; }
#beatCountdown { font-weight: bold; color: #FF6B35; font-size: 11px; }

/* ── Step Grid ───────────────────────────────────── */
.grid-container { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.grid-table { border-spacing: 2px; }
.grid-table td { padding: 0; }
.track-label { font-weight: bold; font-size: 9px; width: 32px; white-space: nowrap; }
.step-num { color: #666; font-size: 7px; text-align: center; width: 22px; }
.grid-gap { width: 4px; }
.step-btn {
  width: 22px; height: 22px; border: 1px solid #444; border-radius: 3px;
  background: #222238; cursor: pointer; padding: 0;
}
.step-btn.downbeat { background: #3D3D58; border-color: #777; }
.step-btn.beat { background: #2F2F48; border-color: #606080; }
.step-btn.active { border-color: var(--track-color); background: var(--track-color); }
.step-btn.current:not(.active) { background: #4A4A6E; border-color: #7A7AAA; }
.step-btn.current.downbeat:not(.active) { background: #5A5A7A; border-color: #9A9ABB; }
.step-btn.current.beat:not(.active) { background: #50506E; border-color: #8888AA; }
.step-btn.active.current { background: #FFD700; border-color: #FFF; }

/* ── Transport ───────────────────────────────────── */
.transport { display: flex; gap: 8px; }
.transport-btn {
  flex: 1; background: #2A2A3E; color: #E0E0E0; border: 1px solid #555; border-radius: 8px;
  font-size: 12px; font-weight: bold; height: 31px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
}
.transport-btn:active { background: #3A3A5E; }
#arpBtn { color: #FFD700; }
#arpBtn.flash { background: #3A2A1E; border-color: #FF6B35; }
.transport-btn.icon-only { flex: 0.5; gap: 0; }
#memoBtn { color: #E0E0E0; }
#memoBtn.active { color: #FFD700; background: #3A2A1E; border-color: #FF6B35; }
.capture-btn {
  position: absolute; top: 10px; right: 10px; z-index: 5;
  width: 30px; height: 30px; border-radius: 50%; padding: 0; line-height: 1;
  background: rgba(20,20,40,0.78); color: #E0E0E0; border: 1px solid #555;
  cursor: pointer; font-size: 14px;
  display: inline-flex; align-items: center; justify-content: center;
}
.capture-btn:active { background: rgba(58,58,94,0.9); }

/* ── Drum Volumes ────────────────────────────────── */
.drum-vol-block { display: flex; flex-direction: column; gap: 6px; padding: 8px 4px 4px; }
.drum-vol-row { display: flex; align-items: center; gap: 8px; }
.drum-vol-row label { font-size: 11px; font-weight: bold; white-space: nowrap; min-width: 38px; color: #CCC; }
.drum-vol-row input[type="range"] { flex: 1; height: 6px; accent-color: #FF6B35; }
.drum-vol-row .val { width: 34px; text-align: right; font-size: 11px; color: #AAA; }

/* ── Presets ──────────────────────────────────────── */
.preset-save-row { display: flex; gap: 4px; margin-bottom: 4px; }
.preset-save-row input[type="text"] {
  flex: 1; background: #2A2A3E; color: #E0E0E0; border: 1px solid #555;
  border-radius: 6px; padding: 4px 8px; font-size: 12px; height: 30px;
}
.preset-save-row input[type="text"]:focus { border-color: #FF6B35; outline: none; }
.preset-btn {
  background: #2A2A3E; color: #E0E0E0; border: 1px solid #555; border-radius: 6px;
  font-size: 11px; font-weight: bold; padding: 0 12px; height: 30px; cursor: pointer;
}
.preset-btn:active { background: #3A3A5E; }
.preset-list {
  background: #2A2A3E; border: 1px solid #555; border-radius: 6px;
  max-height: 80px; overflow-y: auto; font-size: 12px; margin-bottom: 4px;
}
.preset-item { padding: 6px 8px; cursor: pointer; }
.preset-item:active { background: #353550; }
.preset-item.selected { background: #4A4A6E; color: #FFD700; }
.preset-actions { display: flex; gap: 4px; }

.spacer { flex: 1; }
.inner-section { display: flex; flex-direction: column; gap: 6px; padding: 5px 0; }

/* ── Scale Toggles ───────────────────────────────── */
.scale-toggles-grid { display: flex; flex-wrap: wrap; gap: 4px 8px; }
.scale-toggle-label {
  display: flex; align-items: center; gap: 3px; color: #CCC; font-size: 11px; cursor: pointer;
  white-space: nowrap;
}
.scale-toggle-label input[type="checkbox"] { accent-color: #FF6B35; width: 15px; height: 15px; }

/* ── Settings / Practice Calendar ────────────────── */
.settings-field {
  display: flex; flex-direction: column; gap: 3px;
}
.settings-field label {
  font-size: 11px; font-weight: bold; color: #CCC;
}
.settings-field input[type="text"] {
  background: #2A2A3E; color: #E0E0E0; border: 1px solid #555;
  border-radius: 6px; padding: 6px 8px; font-size: 12px; height: 32px;
}
.settings-field input[type="text"]:focus { border-color: #FF6B35; outline: none; }
.settings-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.calendar-status { font-size: 11px; color: #888; min-height: 14px; }
.calendar-status.ok { color: #6FCF6F; }
.calendar-status.err { color: #FF6B6B; }
.calendar-status.busy { color: #00CED1; }
.calendar-mode-row {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
}
.calendar-mode-btn {
  height: 30px; background: #2A2A3E; color: #E0E0E0; border: 1px solid #555;
  border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer;
}
.calendar-mode-btn.active { background: #3A2A1E; border-color: #FF6B35; color: #FFD700; }
.practice-calendar-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px;
}
.calendar-weekday { color: #888; font-size: 9px; text-align: center; font-weight: bold; }
.calendar-day {
  min-height: 46px; border: 1px solid #444; border-radius: 6px;
  background: #222238; padding: 4px 3px; display: flex; flex-direction: column; gap: 2px;
}
.calendar-day.empty { opacity: 0.25; }
.calendar-day.today { border-color: #00CED1; }
.calendar-day.has-practice { background: #2C2A25; border-color: #FF6B35; }
.calendar-day-num { font-size: 10px; color: #DDD; font-weight: bold; }
.calendar-day-count { font-size: 9px; color: #FFD700; }
.calendar-day-min { font-size: 9px; color: #AAA; }
.calendar-summary { color: #CCC; font-size: 11px; }
.practice-history-list {
  background: #2A2A3E; border: 1px solid #555; border-radius: 6px;
  max-height: 120px; overflow-y: auto;
}
.practice-history-row {
  display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px;
  border-bottom: 1px solid #444; font-size: 11px;
}
.practice-history-row:last-child { border-bottom: 0; }
.practice-history-date { color: #E0E0E0; font-weight: bold; }
.practice-history-time { color: #AAA; }
.practice-history-duration { color: #FFD700; white-space: nowrap; }

/* ── Cloud Sync ──────────────────────────────────── */
.cloud-row { display: flex; gap: 6px; align-items: center; }
.cloud-btn {
  background: #2A2A3E; color: #E0E0E0; border: 1px solid #555; border-radius: 6px;
  font-size: 12px; font-weight: bold; padding: 0 16px; height: 34px; cursor: pointer;
}
.cloud-btn:active { background: #3A3A5E; }
.cloud-btn:disabled { opacity: 0.5; cursor: default; }
.cloud-btn.primary { border-color: #FF6B35; color: #FFD700; }
.cloud-status { font-size: 11px; color: #888; min-height: 14px; }
.cloud-status.ok { color: #6FCF6F; }
.cloud-status.err { color: #FF6B6B; }
.cloud-status.busy { color: #00CED1; }
</style>
</head>
<body>
<div class="app layout-horizontal" id="appRoot">

  <div class="top-practice-stack">
  <!-- Practice Display (always visible) -->
  <div class="display-frame" id="displayFrame">
    <div class="display-content">
      <div class="note-text-col">
        <div class="note-display" id="noteDisplay"></div>
        <div class="extra-display" id="extraDisplay"></div>
      </div>
      <canvas id="staffCanvas"></canvas>
    </div>
    <canvas id="rhythmCanvas"></canvas>
    <div class="status-display" id="statusDisplay"></div>
  </div>

  <!-- Mode + Transport row -->
  <div class="mode-row">
    <button class="mode-btn" id="noteModeBtn"><span class="btn-icon">♪</span><span>Note</span></button>
    <button class="mode-btn" id="cagedModeBtn"><span class="btn-icon">▦</span><span>CAGED</span></button>
    <button class="mode-btn" id="chordModeBtn"><span class="btn-icon">♬</span><span>Chord</span></button>
    <button class="mode-btn" id="scaleModeBtn"><span class="btn-icon">↗</span><span>Scale</span></button>
    <button class="mode-btn" id="triadModeBtn"><span class="btn-icon">△</span><span>Triad</span></button>
    <button class="mode-btn" id="rhythmModeBtn"><span class="btn-icon">♬</span><span>Rhythm</span></button>
  </div>
  <div class="transport">
    <button class="transport-btn" id="startBtn" title="Play / Pause — Space"><span class="btn-icon">&#9654;</span><span>Play</span></button>
    <button class="transport-btn" id="stopBtn"><span class="btn-icon">&#9632;</span><span>Stop</span></button>
    <button class="transport-btn icon-only" id="arpBtn" title="Play Guitar — Shift+Space / swipe up"><span class="btn-icon">&#9834;</span></button>
    <button class="transport-btn icon-only" id="memoBtn" title="Memo — mark notes &amp; name the chord">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <rect x="2" y="5.4" width="11.6" height="6.2" rx="1" stroke="currentColor" stroke-width="1.1"/>
        <line x1="4.9" y1="5.4" x2="4.9" y2="11.6" stroke="currentColor" stroke-width="0.7" opacity="0.65"/>
        <line x1="7.8" y1="5.4" x2="7.8" y2="11.6" stroke="currentColor" stroke-width="0.7" opacity="0.65"/>
        <line x1="10.7" y1="5.4" x2="10.7" y2="11.6" stroke="currentColor" stroke-width="0.7" opacity="0.65"/>
        <line x1="2" y1="7.5" x2="13.6" y2="7.5" stroke="currentColor" stroke-width="0.5" opacity="0.5"/>
        <line x1="2" y1="9.5" x2="13.6" y2="9.5" stroke="currentColor" stroke-width="0.5" opacity="0.5"/>
        <line x1="3.1" y1="14" x2="13" y2="2.6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        <circle cx="3.2" cy="13.9" r="1.1" fill="currentColor"/>
      </svg>
    </button>
  </div>

  <!-- Scale Toggles (collapsible) -->
  <div class="section-header collapsed" data-section="scaleToggles">
    <span class="section-title"><span class="section-icon">☑</span><span>Scale Toggles</span></span><span class="arrow">&#9660;</span>
  </div>
  <div class="section-body collapsed" id="scaleTogglesSection">
    <div class="inner-section">
      <div class="scale-toggles-grid" id="scaleTogglesGrid"></div>
    </div>
  </div>
  </div>

  <!-- Fretboard (always visible) -->
  <div class="fret-panel" id="fretPanel">
    <button class="capture-btn" id="captureBtn" title="Capture fretboard as transparent PNG" aria-label="Capture fretboard">&#128247;</button>
    <canvas id="fretCanvas"></canvas>
    <div class="fret-options">
      <label>Tuning:</label>
      <select id="tuningCombo">
        <option>Standard</option><option>Drop D</option><option>Open G</option>
        <option>Open D</option><option>DADGAD</option>
      </select>
      <span id="tuningNotes"></span>
      <div class="fret-legend">
        <span><span class="legend-dot" style="background:#FF6B35"></span>Root</span>
        <span><span class="legend-dot" style="background:#FFD700"></span>Tone</span>
        <span><span class="legend-diamond" style="background:#00CED1"></span>Character</span>
      </div>
    </div>
  </div>

  <!-- Practice Settings (collapsible) -->
  <div class="section-header" data-section="practice">
    <span class="section-title"><span class="section-icon">☷</span><span>Practice Settings</span></span><span class="arrow">&#9660;</span>
  </div>
  <div class="section-body" id="practiceSection">
    <div class="inner-section">
      <div class="slider-row">
        <label>Pre-roll:</label>
        <input type="range" id="prerollSlider" min="0" max="8" value="4">
        <span class="val" id="prerollVal">4</span>
      </div>
      <div class="slider-row">
        <label>Maintain:</label>
        <input type="range" id="beatRepeatSlider" min="1" max="16" value="4">
        <span class="val" id="beatRepeatVal">4</span>
      </div>
      <div class="slider-row">
        <label>Arp vol:</label>
        <input type="range" id="arpVolSlider" min="0" max="1" step="0.01" value="0.5">
        <span class="val" id="arpVolVal">0.50</span>
      </div>
      <div class="practice-controls">
        <div class="practice-control-row">
          <label class="chip-control" id="flatsChip"><input type="checkbox" id="flatsCheck"><span class="btn-icon">Aa</span><span id="flatsLabel">Sharps</span><span id="flatsValue">C#</span></label>
          <label class="chip-control rhythm-chip"><span class="btn-icon">♬</span><span>Rh</span>
            <select id="rhythmDiffCombo">
              <option>Easy</option><option selected>Medium</option><option>Hard</option>

// The defining "character" semitone of each scale (cyan diamond on the fretboard)
const SCALE_CHARACTER = {

  'Harmonic Minor': 11, 'Melodic Minor': 11, 'Dorian': 9, 'Mixolydian': 10,

function getCagedNoteDescs(root, form) {

// ── Tunings ────────────────────────────────────────────────────────
// MIDI of open strings, low (6th) to high (1st)
const TUNINGS = {
  'Standard': [40, 45, 50, 55, 59, 64],  // E A D G B E
  'Drop D':   [38, 45, 50, 55, 59, 64],  // D A D G B E
  'Open G':   [38, 43, 50, 55, 59, 62],  // D G D G B D
  'Open D':   [38, 45, 50, 54, 57, 62],  // D A D F# A D
  'DADGAD':   [38, 45, 50, 55, 57, 62],  // D A D G A D
};
const PORTRAIT_FRETS = 15;
const LANDSCAPE_FRETS = 22;
const ARP_MIN_FRET = 1;
const ARP_MAX_FRET = 15;

function isWideLandscapeLayout() {
  return document.getElementById('appRoot')?.classList.contains('layout-horizontal') && window.innerWidth > 820;

function currentDisplayFrets() {
  return isWideLandscapeLayout() ? LANDSCAPE_FRETS : PORTRAIT_FRETS;

// ── Triad mode data ────────────────────────────────────────────────
const TRIAD_QUALITIES = {
  'Maj': [0, 4, 7], 'min': [0, 3, 7], 'dim': [0, 3, 6], 'aug': [0, 4, 8],
};
const TRIAD_QUALITY_NAMES = ['Maj', 'min', 'dim', 'aug'];
const TRIAD_INVERSIONS = ['Root pos', '1st inv', '2nd inv'];
// String sets as indices into tuning array (0 = low E string), low to high
const TRIAD_STRING_SETS = [
  { idx: [0, 1, 2], label: '6-5-4' },
  { idx: [1, 2, 3], label: '5-4-3' },
  { idx: [2, 3, 4], label: '4-3-2' },
  { idx: [3, 4, 5], label: '3-2-1' },
];
// Semitone stack from root for each inversion: [bass, mid, top]
function triadStack(quality, inversion) {
  const [r, t, f] = TRIAD_QUALITIES[quality];
  if (inversion === 0) return [r, t, f];
  if (inversion === 1) return [t, f, r + 12];
  return [f, r + 12, t + 12];
}
// Staff-spelling quality for a semitone interval above the root
function _spellQ(s) {
  const m = ((s % 12) + 12) % 12;
  return m === 3 ? 'm' : m === 4 ? 'M' : m === 6 ? 'm' : m === 7 ? 'P' : m === 8 ? 'A' : 'P';
}
function getTriadNoteDescs(root, quality, inversion) {
  const stack = triadStack(quality, inversion);
  const descs = stack.map(s => {
    const { noteName, octaveOffset } = _intervalNote(root, s, _spellQ(s));
    return _noteDesc(noteName, octaveOffset);
  }).filter(Boolean);
  const minPos = descs.length ? Math.min(...descs.map(d => d.pos)) : 0;
  const shift = minPos > 0 ? -7 : 0;
  return shift ? descs.map(d => ({ pos: d.pos + shift, acc: d.acc })) : descs;
}
// Map a triad (root pc, quality, inversion) onto 3 specific strings of the
// current tuning. Returns [{s, f, midi, role}] (role: 0=root,1=third,2=fifth)
// or null if it cannot fit within the current visible fret range.
function computeTriadShape(rootPc, quality, inversion, setIdx, tuning) {
  const maxFrets = currentDisplayFrets();
  const stack = triadStack(quality, inversion);
  const roles = [inversion % 3, (inversion + 1) % 3, (inversion + 2) % 3];
  const strings = TRIAD_STRING_SETS[setIdx].idx;
  const candidates = [];
  // Try every octave of the bass note on the bass string
  const bassPc = (rootPc + stack[0]) % 12;
  for (let f0 = 0; f0 <= maxFrets; f0++) {
    if ((tuning[strings[0]] + f0) % 12 !== bassPc) continue;
    const m0 = tuning[strings[0]] + f0;
    const m1 = m0 + (stack[1] - stack[0]);
    const m2 = m0 + (stack[2] - stack[0]);
    const f1 = m1 - tuning[strings[1]];
    const f2 = m2 - tuning[strings[2]];
    if (f1 < 0 || f1 > maxFrets || f2 < 0 || f2 > maxFrets) continue;
    const frets = [f0, f1, f2];
    const spread = Math.max(...frets) - Math.min(...frets);
    candidates.push({ frets, midis: [m0, m1, m2], spread, lo: Math.min(...frets) });
  }
  if (!candidates.length) return null;
  // Prefer compact shapes in the lower neck
  candidates.sort((a, b) => (a.spread - b.spread) || (a.lo - b.lo));
  const best = candidates[0];
  return strings.map((s, i) => ({ s, f: best.frets[i], midi: best.midis[i], role: roles[i] }));
}

// ── CAGED shapes (standard tuning) ─────────────────────────────────
// Per form: anchor string index, min root fret, dot list as [stringIdx, fretOffset],
// root positions marked separately. Offsets relative to root fret R on anchor string.
const CAGED_SHAPES = {
  'C form': { anchor: 1, minR: 3, dots: [[1,0],[2,-1],[3,-3],[4,-2],[5,-3]], roots: [[1,0],[4,-2]] },
  'A form': { anchor: 1, minR: 0, dots: [[1,0],[2,2],[3,2],[4,2],[5,0]],     roots: [[1,0],[3,2]] },
  'G form': { anchor: 0, minR: 3, dots: [[0,0],[1,-1],[2,-3],[3,-3],[4,-3],[5,0]], roots: [[0,0],[3,-3],[5,0]] },
  'E form': { anchor: 0, minR: 0, dots: [[0,0],[1,2],[2,2],[3,1],[4,0],[5,0]],     roots: [[0,0],[2,2],[5,0]] },
  'D form': { anchor: 2, minR: 0, dots: [[2,0],[3,2],[4,3],[5,2]],           roots: [[2,0],[4,3]] },
};
// Resolve a CAGED form for a root note → [{s, f, midi, isRoot}] or null
function computeCagedShape(rootPc, form, tuning) {
  const maxFrets = currentDisplayFrets();
  const shape = CAGED_SHAPES[form];
  if (!shape) return null;
  const open = tuning[shape.anchor];
  let R = -1;
  for (let f = shape.minR; f <= maxFrets; f++) {
    if ((open + f) % 12 === rootPc) { R = f; break; }
  }
  if (R < 0) return null;
  const maxOff = Math.max(...shape.dots.map(d => d[1]));
  if (R + maxOff > maxFrets && R - 12 >= shape.minR) R -= 12;
  if (R + maxOff > maxFrets) return null;
  const rootSet = new Set(shape.roots.map(([s, o]) => s + ':' + o));
  return shape.dots.map(([s, o]) => ({
    s, f: R + o, midi: tuning[s] + R + o, isRoot: rootSet.has(s + ':' + o),
  }));
}

// ── Rhythm mode data ───────────────────────────────────────────────
// Cells are arrays of events {d: duration in 16th slots, r: true if rest}.
// Simple-meter cells span 4 slots (one quarter-note beat);
// compound-meter cells span 6 slots (one dotted-quarter beat).
const RHYTHM_CELLS_SIMPLE = [
  { w: [5, 4, 2], ev: [{d:4}] },                       // quarter
  { w: [4, 4, 3], ev: [{d:2},{d:2}] },                 // two 8ths
  { w: [1, 2, 2], ev: [{d:4,r:true}] },                // quarter rest
  { w: [0, 2, 3], ev: [{d:2,r:true},{d:2}] },          // offbeat 8th
  { w: [0, 1, 2], ev: [{d:2},{d:2,r:true}] },          // 8th + rest
  { w: [0, 2, 3], ev: [{d:1},{d:1},{d:1},{d:1}] },     // four 16ths
  { w: [0, 2, 3], ev: [{d:2},{d:1},{d:1}] },           // 8th + two 16ths
  { w: [0, 2, 3], ev: [{d:1},{d:1},{d:2}] },           // two 16ths + 8th
  { w: [0, 1, 2], ev: [{d:3},{d:1}] },                 // dotted 8th + 16th
  { w: [0, 0, 2], ev: [{d:1},{d:3}] },                 // 16th + dotted 8th (snap)
  { w: [0, 0, 2], ev: [{d:1},{d:2},{d:1}] },           // 16th-8th-16th syncopation
];
const RHYTHM_CELLS_COMPOUND = [
  { w: [5, 3, 2], ev: [{d:6}] },                       // dotted quarter
  { w: [4, 4, 3], ev: [{d:2},{d:2},{d:2}] },           // three 8ths
  { w: [1, 2, 2], ev: [{d:6,r:true}] },                // dotted-quarter rest
  { w: [0, 2, 3], ev: [{d:4},{d:2}] },                 // quarter + 8th
  { w: [0, 2, 3], ev: [{d:2},{d:4}] },                 // 8th + quarter
  { w: [0, 1, 2], ev: [{d:2,r:true},{d:2},{d:2}] },    // rest + two 8ths
  { w: [0, 0, 2], ev: [{d:3},{d:3}] },                 // two dotted 8ths
];
const RHYTHM_DIFF_IDX = { 'Easy': 0, 'Medium': 1, 'Hard': 2 };
// Simple comping chords for rhythm mode: [suffix, triad intervals]
const RHYTHM_CHORDS = [
  ['', [0, 4, 7]], ['m', [0, 3, 7]], ['7', [0, 4, 7, 10]],
];
function generateRhythmBar(meterName, diffName) {
  const compound = meterName.endsWith('/8');
  const pool = compound ? RHYTHM_CELLS_COMPOUND : RHYTHM_CELLS_SIMPLE;
  const cellSlots = compound ? 6 : 4;
  const totalSlots = METER_CONFIG[meterName].steps;
  const nCells = Math.round(totalSlots / cellSlots);
  const di = RHYTHM_DIFF_IDX[diffName] != null ? RHYTHM_DIFF_IDX[diffName] : 1;
  const cells = [];
  for (let i = 0; i < nCells; i++) {
    const weights = pool.map(c => c.w[di]);
    // First cell: avoid starting the bar with a rest so the downbeat is felt
    if (i === 0) pool.forEach((c, j) => { if (c.ev[0].r) weights[j] = 0; });
    let total = weights.reduce((a, b) => a + b, 0), pick = Math.random() * total;
    let chosen = pool[0];
    for (let j = 0; j < pool.length; j++) { pick -= weights[j]; if (pick <= 0) { chosen = pool[j]; break; } }
    cells.push(chosen.ev);
  }
  // Flatten into events with absolute slot positions
  const events = []; let slot = 0;
  for (const cell of cells) {
    for (const e of cell) { events.push({ slot, d: e.d, r: !!e.r }); slot += e.d; }
  }
  return { events, totalSlots, cellSlots };
}

// ── Audio Engine (Web Audio API) ───────────────────────────────────
class AudioEngine {
  constructor() {
    this.ctx = null; this.buffers = {}; this.isLoaded = false;
    this.seqPlaying = false; this.seqStep = 0; this.seqNumSteps = 16;
    this.seqPatterns = {}; this.seqTracks = TRACK_INFO;
    this.seqOnStep = null; this.seqOwner = null;
    this._nextStepTime = 0; this._timerID = null;
    this._scheduleAheadTime = 0.15; this._lookAhead = 25;
    this._loadPromise = null;
  }
  initContext() {
    if (this.ctx) {
      if (this.ctx.state === 'suspended') {
        this.ctx.resume().then(() => this.loadBuffers()).catch(console.error);
      } else if (this.ctx.state === 'running') {
        this.loadBuffers().catch(console.error);
      }
      return;
    }
    try {
      if (navigator.audioSession) {
        navigator.audioSession.type = "playback";
      }
      // Force iOS to route audio through loudspeaker instead of earpiece.
      // Playing a silent <audio> element switches AVAudioSession to playback
      // routing, which Web Audio API then inherits.
      try {
        const silent = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
        silent.play().catch(() => {});
      } catch (e) {}
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) {
        if (statusDisplay) statusDisplay.textContent = "Web Audio not supported";
        return;
      }
      this.ctx = new AudioCtx();
      // On iOS, AudioContext starts suspended — resume must be called within a user gesture.
      // We call it here because initContext() is always triggered from a gesture handler.
      this.ctx.resume().then(() => this.loadBuffers()).catch(console.error);
      // When context transitions back to running (e.g. after phone-call interrupt),
      // reset the scheduler clock so it doesn't try to catch up on stale timestamps.
      this.ctx.onstatechange = () => {
        console.log("AudioContext state:", this.ctx.state);
        if (this.ctx.state === 'running') {
          if (this.seqPlaying) this._nextStepTime = this.ctx.currentTime + 0.1;
          this.loadBuffers().catch(console.error);
        }
      };
    } catch (e) { console.error("Could not init AudioContext:", e); }
  }
  loadBuffers() {
    if (this.isLoaded) return Promise.resolve();
    if (this._loadPromise) return this._loadPromise;
    if (!this.ctx || this.ctx.state !== 'running') return Promise.resolve();
    this._loadPromise = (async () => {
      let anyLoaded = false;
      for (const t of TRACK_INFO) {
        try {
          const resp = await fetch(t.file);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const ab = await resp.arrayBuffer();
          // Callback-based decodeAudioData: the only form supported on iOS < 14.5.
          // The Promise-based overload returns undefined on older WebKit, silently
          // leaving every buffer null and producing total silence.
          this.buffers[t.name] = await new Promise((resolve, reject) => {
            this.ctx.decodeAudioData(ab, resolve, reject);
          });
          console.log(`Loaded ${t.name}`);
          anyLoaded = true;
        } catch (e) { console.warn(`Could not load ${t.file}:`, e); }
      }
      if (anyLoaded) this.isLoaded = true;
      this._loadPromise = null;
    })();
    return this._loadPromise;
  }
  _playSample(name, time, envDur) {
    const buf = this.buffers[name]; if (!buf) return;
    const vol = (typeof trackVolumes !== 'undefined' && trackVolumes[name] != null) ? trackVolumes[name] : 1;
    if (vol === 0) return;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const now = Math.max(time, this.ctx.currentTime);
    const g = this.ctx.createGain(); g.connect(this.ctx.destination);
    if (envDur > 0) {
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(vol, now + 0.005);
      g.gain.setTargetAtTime(0.001, now + 0.005, envDur / 3);
      src.connect(g); src.start(now); src.stop(now + envDur + 0.2);
    } else {
      g.gain.setValueAtTime(vol, now);
      src.connect(g); src.start(now);
    }
  }
  _getStepDuration(step) {
    if (!this.seqOwner) return 0.125;
    const s16 = this.seqOwner.getSixteenthDuration();
    const sr = this.seqOwner.swing / 100.0;
    return step % 2 === 0 ? s16 * 2 * sr : s16 * 2 * (1 - sr);
  }
  _scheduler() {
    // iOS: ctx.resume() from setInterval is silently ignored (not a user gesture).
    // Recovery happens via the onstatechange → _nextStepTime reset path.
    if (!this.ctx || this.ctx.state !== 'running') return;
    while (this._nextStepTime < this.ctx.currentTime + this._scheduleAheadTime) {
      const step = this.seqStep;
      const s16 = this.seqOwner ? this.seqOwner.getSixteenthDuration() : 0.125;
      for (const track of this.seqTracks) {
        const pat = this.seqPatterns[track.name];
        if (pat && step < pat.length && pat[step])
          this._playSample(track.name, this._nextStepTime, track.envMult * s16);
      }
      if (this.seqOnStep) {
        const s = step, stepTime = this._nextStepTime, delay = Math.max(0, (stepTime - this.ctx.currentTime) * 1000);
        setTimeout(() => this.seqOnStep(s, stepTime), delay);
      }
      this._nextStepTime += this._getStepDuration(step);
      this.seqStep = (step + 1) % this.seqNumSteps;
    }
  }
  startSequencer(step = 0) {
    this.initContext();
    if (!this.ctx) return;
    this.seqStep = step;
    this._nextStepTime = this.ctx.currentTime + 0.05;
    this.seqPlaying = true;
    if (this._timerID) clearInterval(this._timerID);
    this._timerID = setInterval(() => this._scheduler(), this._lookAhead);
  }
  stopSequencer() {
    this.seqPlaying = false;
    if (this._timerID !== null) { clearInterval(this._timerID); this._timerID = null; }
  }
}

// ── Subtractive Synth (arpeggio voice) ─────────────────────────────
// Two detuned saws → lowpass with plucky filter envelope → amp envelope.
let arpVolume = 0.5;
const _arpVoices = [];  // live voices {oscs, amp} of the current arpeggio
let _arpTimeouts = [];  // pending highlight timers

function synthNote(midi, when, dur) {
  const ctx = engine.ctx;
  if (!ctx || ctx.state !== 'running' || arpVolume === 0) return;
  const t = Math.max(when, ctx.currentTime);
  const freq = midiToFreq(midi);
  const peak = arpVolume * 0.32;

  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.Q.value = 2.5;
  const fStart = Math.min(7000, freq * 9);
  const fEnd = Math.max(freq * 1.2, 220);
  filter.frequency.setValueAtTime(fStart, t);
  filter.frequency.setTargetAtTime(fEnd, t + 0.005, dur * 0.22);

  // Pure ramp chain (no setTargetAtTime → ramp mixing, which is
  // implementation-dependent): attack → exponential pluck decay → zero.
  const amp = ctx.createGain();
  amp.gain.setValueAtTime(0, t);
  amp.gain.linearRampToValueAtTime(peak, t + 0.008);
  amp.gain.exponentialRampToValueAtTime(Math.max(peak * 0.002, 1e-4), t + Math.max(dur * 0.9, 0.05));
  amp.gain.linearRampToValueAtTime(0, t + dur);

  filter.connect(amp); amp.connect(ctx.destination);

  const voice = { oscs: [], amp };
  for (const det of [-6, 6]) {
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, t);
    osc.detune.setValueAtTime(det, t);
    osc.connect(filter);
    osc.start(t); osc.stop(t + dur + 0.1);
    voice.oscs.push(osc);
  }
  voice.oscs[0].onended = () => { const i = _arpVoices.indexOf(voice); if (i >= 0) _arpVoices.splice(i, 1); };
  _arpVoices.push(voice);
}

function cancelArp() {
  pendingArpLaunch = null;
  const ctx = engine.ctx;
  const now = ctx ? ctx.currentTime : 0;
  for (const v of _arpVoices.splice(0)) {
    try {
      // Click-free retrigger: hold the current level, fade fast, then stop.
      if (v.amp.gain.cancelAndHoldAtTime) v.amp.gain.cancelAndHoldAtTime(now);
      else v.amp.gain.cancelScheduledValues(now);
      v.amp.gain.setTargetAtTime(0, now, 0.012);
      for (const o of v.oscs) o.stop(now + 0.08);
    } catch (e) {}
  }
  for (const id of _arpTimeouts.splice(0)) clearTimeout(id);
  clearFretHighlight();
}

// Play a sequence of notes [{midi, s, f}] as an arpeggio that ends within
// two bars = half of the sequencer cycle. Highlights fretboard dots in sync.
function playArpeggio(notes, leadIn = 0.03, startAt = null) {
  if (!notes || !notes.length) return 0;
  cancelArp();
  const ctx = engine.ctx;
  if (!ctx || ctx.state !== 'running') return 0;
  const s16 = getSixteenthDuration();
  const total = (engine.seqNumSteps / 2) * s16;          // half the cycle
  const spacing = total / Math.max(notes.length, 4);     // snappy for short arps
  const start = startAt == null ? ctx.currentTime + leadIn : Math.max(startAt + leadIn, ctx.currentTime);
  notes.forEach((n, i) => {
    const when = start + i * spacing;
    synthNote(n.midi, when, Math.min(spacing * 1.9, total - i * spacing));
    const delay = Math.max(0, (when - ctx.currentTime) * 1000);
    _arpTimeouts.push(setTimeout(() => {
      if (n.s != null) setFretHighlight(n.s, n.f);
    }, delay));
  });
  // Clear the last highlight when the arpeggio ends
  _arpTimeouts.push(setTimeout(clearFretHighlight, (start - ctx.currentTime + total) * 1000 + 150));
  arpBtn.classList.add('flash');
  _arpTimeouts.push(setTimeout(() => arpBtn.classList.remove('flash'), 250));
  return start - ctx.currentTime + total + 0.15;
}

// Play a rhythm bar on given midis (rhythm mode: chord stabs with the bar's rhythm).
// Rendered at the displayed rhythm timing, swing-aware so the feel matches the drums.
function playRhythmArp(rhythm, chordNotes, leadIn = 0.03, startAt = null) {
  if (!rhythm || !chordNotes || !chordNotes.length) return 0;
  cancelArp();
  const ctx = engine.ctx;
  if (!ctx || ctx.state !== 'running') return 0;
  const s16 = getSixteenthDuration();
  const sr = swing / 100.0;
  // Cumulative swung time of slot n.
  const timeOfSlot = n => (n >> 1) * 2 * s16 + (n % 2 ? 2 * s16 * sr : 0);
  const start = startAt == null ? ctx.currentTime + leadIn : Math.max(startAt + leadIn, ctx.currentTime);
  for (const ev of rhythm.events) {
    if (ev.r) continue;
    const when = start + timeOfSlot(ev.slot);
    const dur = Math.max(0.05, timeOfSlot(ev.slot + ev.d) - timeOfSlot(ev.slot));
    chordNotes.forEach((n, i) => synthNote(n.midi, when + i * 0.008, dur));
    const delay = Math.max(0, (when - ctx.currentTime) * 1000);
    _arpTimeouts.push(setTimeout(() => {
      const root = chordNotes[0];
      if (root && root.s != null) setFretHighlight(root.s, root.f);
    }, delay));
  }
  const total = timeOfSlot(rhythm.totalSlots);
  _arpTimeouts.push(setTimeout(clearFretHighlight, (start - ctx.currentTime + total) * 1000 + 150));
  arpBtn.classList.add('flash');
  _arpTimeouts.push(setTimeout(() => arpBtn.classList.remove('flash'), 250));
  return start - ctx.currentTime + total + 0.15;
}

// ── Staff Notation Canvas ──────────────────────────────────────────
const STAFF_W = 180, STAFF_H = 144, STAFF_H_GRAND = 224;
// Grand staff (treble + bass) in the horizontal/landscape layout for a wider note range.
function staffHeight() {
  const r = document.getElementById('appRoot');
  return (r && r.classList.contains('layout-horizontal')) ? STAFF_H_GRAND : STAFF_H;
}
function initStaffCanvas() {
  const canvas = document.getElementById('staffCanvas');
  if (!canvas) return;
  const dpr = window.devicePixelRatio || 1;
  const H = staffHeight();
  canvas.width = STAFF_W * dpr; canvas.height = H * dpr;
  canvas.style.width = STAFF_W + 'px'; canvas.style.height = H + 'px';
  canvas.getContext('2d').scale(dpr, dpr);
}
// input: note name string (single note) OR array of {pos,acc} descriptors OR falsy (clear)
// isScale: if true, spread notes horizontally like a scale on sheet music
function drawStaffCanvas(input, isScale) {
  const canvas = document.getElementById('staffCanvas');
  if (!canvas) return;

  // Resolve to array of {pos, acc}
  let noteDescs;
  if (!input || (Array.isArray(input) && input.length === 0)) {
    noteDescs = [];
  } else if (Array.isArray(input)) {
    noteDescs = input;
  } else {
    const match = ('' + input).match(/^([A-G][#b]?)/);
    if (!match) { noteDescs = []; } else {
      const nd = _BASE_ND[match[1]]; noteDescs = nd ? [nd] : [];
    }
  }

  // Dynamic canvas width for scale mode
  const noteCount = noteDescs.length;
  const W = isScale && noteCount > 1 ? Math.max(STAFF_W, 66 + noteCount * 36) : STAFF_W;
  const grand = staffHeight() === STAFF_H_GRAND;
  const H = grand ? STAFF_H_GRAND : STAFF_H;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  const c = canvas.getContext('2d');
  c.scale(dpr, dpr);

  // One continuous position axis: y(pos) = midY - pos*unit. Treble lines at pos -4..4,
  // bass lines at -16..-8 (grand). Middle C (pos -6) sits exactly between the two staves.
  const lineSpacing = grand ? H / 16 : H / 8;
  const unit = lineSpacing / 2;
  const midY = grand ? lineSpacing * 5 : H / 2;
  const staffLeft = W * 0.18, staffRight = W * 0.97;
  const staffColor = '#888', noteColor = '#FFD700';

  c.strokeStyle = staffColor; c.lineWidth = 1;
  for (const p of [-4, -2, 0, 2, 4]) { const y = midY - p * unit; c.beginPath(); c.moveTo(staffLeft, y); c.lineTo(staffRight, y); c.stroke(); }
  c.fillStyle = staffColor; c.textAlign = 'left'; c.textBaseline = 'middle';
  c.font = (lineSpacing * (grand ? 4.2 : 5)) + 'px serif';
  c.fillText('\u{1D11E}', W * 0.01, midY - lineSpacing * 0.5);   // treble clef
  if (grand) {
    for (const p of [-16, -14, -12, -10, -8]) { const y = midY - p * unit; c.beginPath(); c.moveTo(staffLeft, y); c.lineTo(staffRight, y); c.stroke(); }
    c.fillStyle = staffColor; c.font = (lineSpacing * 2.8) + 'px serif';
    c.fillText('\u{1D122}', W * 0.02, midY - (-11) * unit);      // bass clef
  }
  // Ledger lines for a note head at canvas-x lx and staff position pos (grand-aware).
  const drawLedgersAt = (lx, pos) => {
    const pad = lineSpacing * 0.83;
    c.strokeStyle = staffColor; c.lineWidth = 1;
    const ln = y => { c.beginPath(); c.moveTo(lx - pad, y); c.lineTo(lx + pad, y); c.stroke(); };
    if (grand) {
      if (pos > 4) { for (let q = 6; q <= pos; q += 2) ln(midY - q * unit); }
      else if (pos === -6) { ln(midY - (-6) * unit); }
      else if (pos < -16) { for (let q = -18; q >= pos; q -= 2) ln(midY - q * unit); }
    } else {
      for (let q = -6; q >= pos; q -= 2) ln(midY - q * unit);
      for (let q = 6; q <= pos; q += 2) ln(midY - q * unit);
    }
  };

  if (noteDescs.length === 0) return;

  const rx = lineSpacing * 0.52, ry = lineSpacing * 0.38;
  const lpad = rx * 1.6;

  if (isScale && noteCount > 1) {
    // ── Scale mode: spread notes horizontally ──
    const startX = W * 0.24;
    const endX = W * 0.92;
    const step = (endX - startX) / (noteCount - 1);

    for (let i = 0; i < noteCount; i++) {
      const nd = noteDescs[i];
      const noteX = startX + i * step;
      const noteY = midY - nd.pos * unit;

      // Ledger lines for this note
      drawLedgersAt(noteX, nd.pos);

      // Note head
      c.fillStyle = noteColor;
      c.beginPath(); c.ellipse(noteX, noteY, rx, ry, -0.25, 0, Math.PI*2); c.fill();

      // Accidental
      if (nd.acc) {
        c.font = 'bold ' + (lineSpacing*1.4) + 'px serif';
        c.textAlign = 'right'; c.textBaseline = 'middle';
        c.fillStyle = noteColor;
        c.fillText(nd.acc === '#' ? '♯' : '♭', noteX - rx - 2, noteY);
      }
    }
    // No stem in scale mode
  } else {
    // ── Chord / single-note mode ──
    const noteX = W * 0.70;
    const positions = noteDescs.map(d => d.pos);

    // Ledger lines (per note, grand-aware)
    for (const nd of noteDescs) drawLedgersAt(noteX, nd.pos);

    // Note heads and accidentals
    c.fillStyle = noteColor;
    for (const nd of noteDescs) {
      const noteY = midY - nd.pos * unit;
      c.beginPath(); c.ellipse(noteX, noteY, rx, ry, -0.25, 0, Math.PI*2); c.fill();
      if (nd.acc) {
        c.font = 'bold ' + (lineSpacing*1.6) + 'px serif';
        c.textAlign = 'right'; c.textBaseline = 'middle';
        c.fillText(nd.acc === '#' ? '♯' : '♭', noteX - rx - 3, noteY);
      }
    }

    // Stem(s): one per staff group so a grand-staff chord doesn't draw a stem across the gap.
    c.strokeStyle = noteColor; c.lineWidth = 1.5;
    const stemFor = (ps) => {
      if (!ps.length) return;
      const mn = Math.min(...ps), mx = Math.max(...ps);
      const avg = ps.reduce((a,b)=>a+b,0) / ps.length;
      c.beginPath();
      if (avg < 0) { const hy = midY - mx * unit; c.moveTo(noteX+rx-1, hy); c.lineTo(noteX+rx-1, hy - lineSpacing*3.5); }
      else { const ly = midY - mn * unit; c.moveTo(noteX-rx+1, ly); c.lineTo(noteX-rx+1, ly + lineSpacing*3.5); }
      c.stroke();
    };
    if (grand) { stemFor(positions.filter(p => p >= -6)); stemFor(positions.filter(p => p < -6)); }
    else stemFor(positions);
  }
}

// ── Rhythm Notation Canvas ─────────────────────────────────────────
// Renders one bar of rhythm (from generateRhythmBar) as slash notation:
// stems up, beams within each beat cell, simplified rests, playhead line.
const RHY_H = 76;
function drawRhythmBar(rhythm, playSlot) {
  const canvas = document.getElementById('rhythmCanvas');
  if (!canvas) return;
  const frame = document.getElementById('displayFrame');
  // frame content box: clientWidth minus 16px horizontal padding per side
  const maxW = Math.max(120, Math.min(frame.clientWidth - 32, 640));
  if (!rhythm) {
    canvas.width = 0; canvas.height = 0;
    canvas.style.width = '0px'; canvas.style.height = '0px';
    return;
  }
  const { events, totalSlots, cellSlots } = rhythm;
  const padL = 14, padR = 10;
  const slotW = Math.min(30, (maxW - padL - padR) / totalSlots);
  const W = Math.round(padL + padR + slotW * totalSlots);
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = RHY_H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = RHY_H + 'px';
  const c = canvas.getContext('2d');
  c.scale(dpr, dpr);

  const baseY = 52;      // notation line
  const beamY = 16;      // top of stems / beam height
  const xOf = slot => padL + slot * slotW;

  // Base line + beat gridlines + barlines
  c.strokeStyle = '#555'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(padL - 6, baseY); c.lineTo(W - padR + 6, baseY); c.stroke();
  c.strokeStyle = '#333';
  for (let s = cellSlots; s < totalSlots; s += cellSlots) {
    c.beginPath(); c.moveTo(xOf(s), baseY - 26); c.lineTo(xOf(s), baseY + 8); c.stroke();
  }
  c.strokeStyle = '#888'; c.lineWidth = 2;
  for (const bx of [padL - 6, W - padR + 6]) {
    c.beginPath(); c.moveTo(bx, baseY - 30); c.lineTo(bx, baseY + 10); c.stroke();
  }

  // Playhead
  if (playSlot != null && playSlot >= 0 && playSlot < totalSlots) {
    c.strokeStyle = 'rgba(255,107,53,0.85)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(xOf(playSlot) + slotW * 0.5, 6); c.lineTo(xOf(playSlot) + slotW * 0.5, RHY_H - 6); c.stroke();
  }

  const isCurrent = ev => playSlot != null && playSlot >= ev.slot && playSlot < ev.slot + ev.d;
  const headRx = Math.min(slotW * 0.42, 6.5), headRy = headRx * 0.72;

  // Build beam groups: consecutive beamable notes (d<=3, not rest) within one cell
  const groups = [];
  let cur = [];
  for (const ev of events) {
    const cellIdx = Math.floor(ev.slot / cellSlots);
    const beamable = !ev.r && ev.d <= 3;
    if (beamable && cur.length && Math.floor(cur[cur.length - 1].slot / cellSlots) === cellIdx) cur.push(ev);
    else { if (cur.length) groups.push(cur); cur = beamable ? [ev] : []; }
  }
  if (cur.length) groups.push(cur);
  const inGroup = new Map();
  groups.forEach(g => { if (g.length > 1) g.forEach(ev => inGroup.set(ev, g)); });

  // Draw events
  for (const ev of events) {
    const x = xOf(ev.slot) + headRx + 1;
    const col = isCurrent(ev) ? '#FFD700' : '#E0E0E0';
    c.fillStyle = col; c.strokeStyle = col;
    if (ev.r) { drawRest(c, x, baseY, ev.d, col); continue; }
    // Head (slash style)
    c.beginPath(); c.ellipse(x, baseY, headRx, headRy, -0.35, 0, Math.PI * 2); c.fill();
    // Dot for dotted values (3 = dotted 8th, 6 = dotted quarter)
    if (ev.d === 3 || ev.d === 6) {
      c.beginPath(); c.arc(x + headRx + 4, baseY - 3, 2, 0, Math.PI * 2); c.fill();
    }
    // Stem
    c.lineWidth = 1.6;
    c.beginPath(); c.moveTo(x + headRx - 0.5, baseY - 2); c.lineTo(x + headRx - 0.5, beamY); c.stroke();
    // Flags for isolated beamable notes
    if (!inGroup.has(ev) && ev.d <= 3) {
      const flags = ev.d === 1 ? 2 : 1;
      c.lineWidth = 1.8;
      for (let f = 0; f < flags; f++) {
        c.beginPath();
        c.moveTo(x + headRx - 0.5, beamY + f * 5);
        c.bezierCurveTo(x + headRx + 7, beamY + 4 + f * 5, x + headRx + 8, beamY + 9 + f * 5, x + headRx + 4, beamY + 14 + f * 5);
        c.stroke();
      }
    }
  }

  // Draw beams
  c.lineWidth = 3;
  for (const g of groups) {
    if (g.length < 2) continue;
    const stemX = ev => xOf(ev.slot) + headRx + 1 + headRx - 0.5;
    const x0 = stemX(g[0]), x1 = stemX(g[g.length - 1]);
    const anyCur = g.some(isCurrent);
    c.strokeStyle = anyCur ? '#FFD700' : '#E0E0E0';
    // Primary beam across the whole group
    c.beginPath(); c.moveTo(x0, beamY + 1.5); c.lineTo(x1, beamY + 1.5); c.stroke();
    // Secondary beams for 16ths: continuous across runs, stub when isolated
    for (let i = 0; i < g.length; i++) {
      if (g[i].d !== 1) continue;
      const xs = stemX(g[i]);
      const leftIs16 = i > 0 && g[i - 1].d === 1;
      const rightIs16 = i + 1 < g.length && g[i + 1].d === 1;
      if (rightIs16) {
        c.beginPath(); c.moveTo(xs, beamY + 6.5); c.lineTo(stemX(g[i + 1]), beamY + 6.5); c.stroke();
      } else if (!leftIs16) {
        // Stub toward the nearest neighbour
        const dir = i > 0 ? -1 : 1;
        c.beginPath(); c.moveTo(xs, beamY + 6.5); c.lineTo(xs + dir * slotW * 0.7, beamY + 6.5); c.stroke();
      }
    }
  }
}
function drawRest(c, x, baseY, d, col) {
  c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 2.2;
  if (d >= 4) {
    // Quarter rest: simplified zigzag (+ dot if dotted-quarter, d=6)
    c.beginPath();
    c.moveTo(x - 3, baseY - 22);
    c.lineTo(x + 3, baseY - 15);
    c.lineTo(x - 2, baseY - 9);
    c.quadraticCurveTo(x + 5, baseY - 6, x + 2, baseY - 1);
    c.stroke();
    if (d === 6) { c.beginPath(); c.arc(x + 8, baseY - 12, 2, 0, Math.PI * 2); c.fill(); }
  } else {
    // 8th / 16th rest: ball(s) + diagonal stem
    const balls = d === 1 ? 2 : 1;
    for (let b = 0; b < balls; b++) {
      c.beginPath(); c.arc(x - 2 - b * 2, baseY - 16 + b * 6, 2.4, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.moveTo(x - 2 - b * 2, baseY - 14 + b * 6);
      c.quadraticCurveTo(x + 2, baseY - 13 + b * 6, x + 4 - b, baseY - 16 + b * 6);
      c.stroke();
    }
    c.beginPath(); c.moveTo(x + 4, baseY - 16); c.lineTo(x - 1, baseY - 2); c.stroke();
    if (d === 3) { c.beginPath(); c.arc(x + 7, baseY - 10, 2, 0, Math.PI * 2); c.fill(); }
  }
}

// ── Fretboard Renderer ─────────────────────────────────────────────
// Realistic 2D neck: rosewood board + grain, bone nut, metallic frets with
// true logarithmic spacing, pearl inlays, gauge-graded strings (wound look
// on the bass strings). Low E at the bottom (TAB convention), nut at left.
const fretCanvas = document.getElementById('fretCanvas');
const fretCtx = fretCanvas.getContext('2d');
let currentTuning = 'Standard';
let fretMarkers = [];          // [{s, f, type:'root'|'tone'|'char', label}]
let fretHighlight = null;      // {s, f, t0} arpeggio pulse
let _fretBase = null;          // cached base-layer canvas
let _fretGeom = null;          // layout geometry

// Deterministic pseudo-random for wood grain (stable across redraws)
function _grainRand(seed) { let x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

function computeFretGeometry(W, H, maxFretsArg, opts) {
  opts = opts || {};
  const maxFrets = maxFretsArg != null ? maxFretsArg : currentDisplayFrets();
  const padT = opts.padTop != null ? opts.padTop : 10;
  const padB = opts.padBottom != null ? opts.padBottom : 24;
  const labelW = opts.labelW != null ? opts.labelW : 26;
  const nutX = labelW + 8;
  const boardR = W - 6;
  const d = n => 1 - Math.pow(2, -n / 12);
  const dMax = d(maxFrets);
  const fretX = []; // fretX[n] = x of fret wire n (0 = nut)
  for (let n = 0; n <= maxFrets; n++) fretX.push(nutX + (d(n) / dMax) * (boardR - nutX));
  const stringY = []; // index 0 = low E (bottom) .. 5 = high E (top)
  for (let i = 0; i < 6; i++) stringY.push(H - padB - i * (H - padT - padB) / 5);
  return { W, H, padT, padB, nutX, boardR, fretX, stringY };
}
// Center x of a fretted note (between the previous and current fret wires)
function noteX(g, f) {
  if (f === 0) return g.nutX - 13;
  return (g.fretX[f - 1] + g.fretX[f]) / 2;
}

function buildFretBase(W, H, tuning, opts) {
  opts = opts || {};
  const maxFrets = opts.maxFrets != null ? opts.maxFrets : currentDisplayFrets();
  const g = computeFretGeometry(W, H, maxFrets, { padTop: opts.padTop, padBottom: opts.padBottom, labelW: opts.labelW });
  const cv = document.createElement('canvas');
  const dpr = opts.scale != null ? opts.scale : (window.devicePixelRatio || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  const c = cv.getContext('2d');
  c.scale(dpr, dpr);
  const { padT, padB, nutX, boardR, fretX, stringY } = g;
  const boardTop = padT - 4, boardBot = H - padB + 8;

  // Headstock side (behind labels) — skipped for transparent capture (sticker, no app backdrop).
  if (!opts.transparent) {
    c.fillStyle = '#0E0E22';
    c.fillRect(0, 0, W, H);
  }

  // Rosewood board
  const wood = c.createLinearGradient(0, boardTop, 0, boardBot);
  wood.addColorStop(0, '#4A2E1D');
  wood.addColorStop(0.18, '#3A2316');
  wood.addColorStop(0.5, '#54341F');
  wood.addColorStop(0.82, '#3A2316');
  wood.addColorStop(1, '#2E1B10');
  c.fillStyle = wood;
  c.fillRect(nutX, boardTop, boardR - nutX, boardBot - boardTop);

  // Wood grain: faint wavy horizontal streaks (deterministic)
  c.save();
  c.beginPath(); c.rect(nutX, boardTop, boardR - nutX, boardBot - boardTop); c.clip();
  for (let i = 0; i < 22; i++) {
    const y0 = boardTop + _grainRand(i) * (boardBot - boardTop);
    const amp = 1 + _grainRand(i + 50) * 2.5;
    c.strokeStyle = `rgba(${_grainRand(i+99) > 0.5 ? '20,10,5' : '120,75,45'},${0.05 + _grainRand(i + 31) * 0.08})`;
    c.lineWidth = 0.7 + _grainRand(i + 77) * 1.6;
    c.beginPath();
    for (let x = nutX; x <= boardR; x += 14) {
      const y = y0 + Math.sin(x * 0.018 + i * 3.1) * amp;
      x === nutX ? c.moveTo(x, y) : c.lineTo(x, y);
    }
    c.stroke();
  }
  c.restore();

  // Pearl inlays
  const midY = (boardTop + boardBot) / 2;
  const inlayR = Math.min(7, (boardBot - boardTop) * 0.075);
  c.fillStyle = 'rgba(216,208,192,0.8)';
  for (const f of [3, 5, 7, 9, 15, 17, 19, 21]) {
    if (f > maxFrets) continue;
    c.beginPath(); c.arc(noteX(g, f), midY, inlayR, 0, Math.PI * 2); c.fill();
  }
  if (maxFrets >= 12) {
    const x12 = noteX(g, 12);
    const off = (boardBot - boardTop) * 0.22;
    c.beginPath(); c.arc(x12, midY - off, inlayR, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(x12, midY + off, inlayR, 0, Math.PI * 2); c.fill();
  }

  // Fret wires (metallic)
  for (let n = 1; n <= maxFrets; n++) {
    const x = fretX[n];
    const fg = c.createLinearGradient(x - 2, 0, x + 2, 0);
    fg.addColorStop(0, '#6A6A72');
    fg.addColorStop(0.5, '#D8D8E0');
    fg.addColorStop(1, '#55555D');
    c.fillStyle = fg;
    c.fillRect(x - 1.6, boardTop, 3.2, boardBot - boardTop);
  }
  // Nut (bone)
  const ng = c.createLinearGradient(nutX - 4, 0, nutX + 4, 0);
  ng.addColorStop(0, '#B8AE98');
  ng.addColorStop(0.5, '#EFE6D2');
  ng.addColorStop(1, '#A89E88');
  c.fillStyle = ng;
  c.fillRect(nutX - 4, boardTop - 2, 8, boardBot - boardTop + 4);

  // Strings: low E (i=0, bottom, thick & wound) → high E (thin, plain)
  const tuningArr = TUNINGS[tuning];
  const stdArr = TUNINGS['Standard'];
  for (let i = 0; i < 6; i++) {
    const y = stringY[i];
    const wdt = 3.2 - i * 0.42;
    // shadow
    c.strokeStyle = 'rgba(0,0,0,0.45)';
    c.lineWidth = wdt;
    c.beginPath(); c.moveTo(nutX - 4, y + 1.5); c.lineTo(boardR, y + 1.5); c.stroke();
    // string body
    c.strokeStyle = i < 3 ? '#B9A98C' : '#C9C9D4';   // bronze wound vs plain steel
    c.lineWidth = wdt;
    c.beginPath(); c.moveTo(nutX - 4, y); c.lineTo(boardR, y); c.stroke();
    // winding hint on wound strings
    if (i < 3) {
      c.strokeStyle = 'rgba(60,45,25,0.5)';
      c.lineWidth = wdt;
      c.setLineDash([1, 2.2]);
      c.beginPath(); c.moveTo(nutX - 4, y); c.lineTo(boardR, y); c.stroke();
      c.setLineDash([]);
    }
    // highlight sheen
    c.strokeStyle = 'rgba(255,255,255,0.35)';
    c.lineWidth = Math.max(0.6, wdt * 0.25);
    c.beginPath(); c.moveTo(nutX - 4, y - wdt * 0.25); c.lineTo(boardR, y - wdt * 0.25); c.stroke();

    // Open-string label (orange when retuned away from standard)
    const retuned = tuningArr[i] !== stdArr[i];
    c.fillStyle = retuned ? '#FF6B35' : '#9999BB';
    c.font = 'bold 11px -apple-system, sans-serif';
    c.textAlign = 'right'; c.textBaseline = 'middle';
    c.fillText(nameOfPc(tuningArr[i] % 12, false), nutX - 22, y);
  }

  // Fret numbers
  c.fillStyle = '#777';
  c.font = '9px -apple-system, sans-serif';
  c.textAlign = 'center'; c.textBaseline = 'top';
  for (const f of [3, 5, 7, 9, 12, 15, 17, 19, 21]) {
    if (f > maxFrets) continue;
    c.fillText(String(f), noteX(g, f), boardBot + 4);
  }
  return { canvas: cv, geom: g };
}

function sizeFretCanvas() {
  const panel = document.getElementById('fretPanel');
  const wide = isWideLandscapeLayout();
  const W = Math.max(wide ? 580 : 280, panel.clientWidth - 16);
  const H = Math.round(Math.min(wide ? 280 : 210, Math.max(wide ? 170 : 140, W * (wide ? 0.235 : 0.26))));
  const dpr = window.devicePixelRatio || 1;
  fretCanvas.width = W * dpr; fretCanvas.height = H * dpr;
  fretCanvas.style.width = W + 'px'; fretCanvas.style.height = H + 'px';
  fretCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  _fretBase = null; // size changed → rebuild base layer
  drawFretboard();
}

// Render note-marker dots onto any 2D context using the given geometry (shared by live board + capture).
function drawFretDots(ctx, g, markers, maxFrets, baseR) {
  for (const dot of markers) {
    if (dot.f < 0 || dot.f > maxFrets) continue;
    const x = noteX(g, dot.f), y = g.stringY[dot.s];

    for (const { pc, type } of pcs.map(pc2 => ({
      pc: ((pc2 % 12) + 12) % 12,
      type: ((pc2 - rootPc) % 12 + 12) % 12 === 0 ? 'root' : (charPc != null && pc2 % 12 === charPc % 12 ? 'char' : 'tone'),
    }))) {
      for (const pos of allPositionsOfPc(pc, tuning)) dots.push({ s: pos.s, f: pos.f, type, label: pcLabel(pc) });
    }

  if (practiceMode === 'note') {
    const pc = pcOf(currentNote);

    while (m > highMidi) m -= 12;

    for (let s = 0; s < 6; s++) {

      const target = Math.max(minFret, Math.min(maxFret, anchor == null ? startFret : anchor));

  if (practiceMode === 'caged' && currentNote) {

    const m0 = rootMidiForPc(rootPc);

    url.searchParams.set('singleEvents', 'true');

    url.searchParams.set('timeMin', '2000-01-01T00:00:00Z');
    url.searchParams.set('q', 'Guitar Practiced');
    if (pageToken) url.searchParams.set('pageToken', pageToken);
    const response = await fetch(url.toString(), { headers: { Authorization: 'Bearer ' + token } });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const payload = await response.json();

      const start = item.start && (item.start.dateTime || item.start.date);
      const end = item.end && (item.end.dateTime || item.end.date);
      if (!start) continue;

function mergeGooglePracticeEvents(events) {

    const byId = practiceHistory.find(entry => entry.googleEventId === ev.eventId);
    if (byId) {
      byId.calendarId = ev.calendarId;
      byId.endAt = ev.endAt;
      continue;
    }
    const byTime = practiceHistory.find(entry => {
      if (Math.abs(new Date(entry.startAt) - new Date(ev.startAt)) >= 2000) return false;
      if (!entry.endAt && !ev.endAt) return true;
      if (entry.endAt && ev.endAt) return Math.abs(new Date(entry.endAt) - new Date(ev.endAt)) < 2000;
      return false;
    });
    if (byTime) {
      byTime.calendarId = ev.calendarId;
      byTime.googleEventId = ev.eventId;
      byTime.endAt = ev.endAt;
      continue;
    }
    practiceHistory.push({
      id: 'google-' + ev.eventId,
      startAt: ev.startAt,
      endAt: ev.endAt,
      calendarId: ev.calendarId,
      googleEventId: ev.eventId,
      source: 'google',

}

function calendarDaysForMode() {

    const start = new Date(today);
    start.setHours(0, 0, 0, 0);
    start.setDate(start.getDate() - start.getDay());
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      return d;
    });
  }
  const first = new Date(today.getFullYear(), today.getMonth(), 1);
  const days = Array(first.getDay()).fill(null);
  const last = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  for (let i = 1; i <= last; i++) days.push(new Date(today.getFullYear(), today.getMonth(), i));

// Space = Play/Pause the sequence (pause/resume — identical to the transport button,

function togglePlayPause() {
  ensureAudio().then(() => {
    if (playing && !paused) { paused = true; stopPlayback(); setStartButtonState(false); }
    else if (paused) { paused = false; syncEngineOwner(); startPlayback(); setStartButtonState(true); }
    else { currentStep = 0; startPlayback(); setStartButtonState(true); }

// ── Keyboard shortcuts ─────────────────────────────────────────────
// Space = Play/Pause · Shift+Space = Arp · R = Repeat lock · A = Arp lock
// N/C/H/S/T/Y = Note/CAGED/Chord/Scale/Triad/Rhythm modes
const _MODE_KEYS = { n: 'note', c: 'caged', h: 'chord', s: 'scale', t: 'triad', y: 'rhythm' };
window.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toUpperCase();
  if (/INPUT|SELECT|TEXTAREA/.test(tag) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  // Space → Play/Pause (pause/resume) · Shift+Space → arpeggio
  if (e.code === 'Space' || e.key === ' ') {
    e.preventDefault();
    if (e.repeat) return;
    if (e.shiftKey) triggerArp();
    else togglePlayPause();
    return;
  }
  if (e.repeat || e.shiftKey) return;

  const k = e.key.toLowerCase();
  if (k === 'r') { e.preventDefault(); setPromptLocked(!promptLocked); return; }
  if (k === 'a') { e.preventDefault(); setArpLocked(!arpLocked); return; }
  if (_MODE_KEYS[k]) { e.preventDefault(); onMode(_MODE_KEYS[k]); return; }
});

// Swipe up (mobile) — ignore flicks that scrolled the page or an inner scroller
let _swipeX0 = null, _swipeY0 = null, _swipeT0 = 0, _swipeScrollY0 = 0, _swipeScrolled = false;
// scroll events don't bubble, but a capture-phase listener on document sees
// scrolls of the page AND of inner scrollers (e.g. .grid-container).
document.addEventListener('scroll', () => { _swipeScrolled = true; }, { capture: true, passive: true });
document.addEventListener('touchstart', e => {
  if (e.touches.length > 1) { _swipeX0 = _swipeY0 = null; return; } // multi-touch: abort tracking
  const t = e.touches[0];
  _swipeX0 = t.clientX; _swipeY0 = t.clientY; _swipeT0 = performance.now();
  _swipeScrollY0 = (document.scrollingElement || document.documentElement).scrollTop;
  _swipeScrolled = false;
}, { passive: true });
document.addEventListener('touchcancel', () => { _swipeX0 = _swipeY0 = null; }, { passive: true });
document.addEventListener('touchend', e => {
  if (_swipeY0 == null) return;
  if (e.touches.length > 0) { _swipeX0 = _swipeY0 = null; return; } // other fingers still down
  const t = e.changedTouches[0];
  const dx = t.clientX - _swipeX0, dy = t.clientY - _swipeY0, dt = performance.now() - _swipeT0;
  _swipeX0 = _swipeY0 = null;
  if (dt > 600 || dy > -60 || Math.abs(dx) > Math.abs(dy) * 0.6) return;
  const scNow = (document.scrollingElement || document.documentElement).scrollTop;
  if (_swipeScrolled || Math.abs(scNow - _swipeScrollY0) > 5) return; // it was a scroll flick
  const tag = (e.target.tagName || '').toUpperCase();
  if (/INPUT|SELECT|TEXTAREA|BUTTON/.test(tag)) return;
  if (e.target.closest && e.target.closest('.grid-container, .preset-list')) return;
  triggerArp();
}, { passive: true });

  });
}
function loadPreset(idx) {
  if (idx < 0 || idx >= presets.length) return; const p = presets[idx];
  if (playing) { stopPlayback(); currentStep = 0; playing = false; paused = false; setStartButtonState(false); clearHighlight(); stopPractice(); }
  bpm = parseFloat(p.bpm); bpmSpin.value = bpm.toFixed(1); bpmSlider.value = Math.round(bpm * 10);
  doubleTime = p.double_time === "1"; dtCheck.checked = doubleTime;
  swing = parseInt(p.swing); swingSlider.value = swing; swingVal.textContent = swing + '%';
  meter = p.meter; meterCombo.value = meter;
  for (const t of TRACK_INFO) patterns[t.name] = p[t.name] ? strToPattern(p[t.name]) : new Array(24).fill(false);
  currentStep = 0; prevHighlight = -1; engine.seqNumSteps = METER_CONFIG[meter].steps; buildGrid();
}
$('saveBtn').addEventListener('click', () => {
  const name = presetNameEdit.value.trim(); if (!name) return;
  const n = METER_CONFIG[meter].steps, row = { name, bpm: String(bpm), double_time: doubleTime ? "1" : "0", meter, swing: String(swing) };
  for (const t of TRACK_INFO) row[t.name] = patternToStr(t.name, n);
  presets = presets.filter(p => p.name !== name); presets.push(row); refreshPresetList(); presetNameEdit.value = '';
});
$('loadBtn').addEventListener('click', () => loadPreset(selectedPresetIdx));
$('deleteBtn').addEventListener('click', () => { if (selectedPresetIdx >= 0 && selectedPresetIdx < presets.length) { presets.splice(selectedPresetIdx, 1); refreshPresetList(); } });

// ── Scale Toggles ──────────────────────────────────────────────────
function buildScaleToggles() {
  const grid = $('scaleTogglesGrid');
  grid.innerHTML = '';
  SCALE_NAMES.forEach(name => {
    const label = document.createElement('label');
    label.className = 'scale-toggle-label';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = scaleEnabled[name];
    cb.addEventListener('change', () => { scaleEnabled[name] = cb.checked; });
    label.appendChild(cb);
    label.appendChild(document.createTextNode(name));
    grid.appendChild(label);
  });
}

// ── Drum Volume Sliders ────────────────────────────────────────────
const DRUM_VOL_IDS = [
  { id: 'volKick',  valId: 'volKickVal',  name: 'Kick'  },
  { id: 'volSnare', valId: 'volSnareVal', name: 'Snare' },
  { id: 'volCHat',  valId: 'volCHatVal',  name: 'C-Hat' },
  { id: 'volOHat',  valId: 'volOHatVal',  name: 'O-Hat' },
];
DRUM_VOL_IDS.forEach(({ id, valId, name }) => {
  const slider = $(id), label = $(valId);
  slider.addEventListener('input', () => {
    trackVolumes[name] = parseInt(slider.value) / 25;
    label.textContent = slider.value;
  });
});

// ── Cloud Sync (Supabase Storage, dedicated CSV) ───────────────────
const SUPABASE_URL = 'https://upqnxyllnenivehmallp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_o7KDz58nXdjLN7TwOw2Xhg_VBWzOccH';
const BUCKET       = 'csv-data';
const DATA_FILE    = 'guitar_practice_settings.csv';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
const cloudSaveBtn = $('cloudSaveBtn'), cloudLoadBtn = $('cloudLoadBtn'), cloudStatus = $('cloudStatus');

function setCloudStatus(msg, cls) {
  cloudStatus.textContent = msg;
  cloudStatus.className = 'cloud-status' + (cls ? ' ' + cls : '');
}
function setCloudBusy(busy) { cloudSaveBtn.disabled = busy; cloudLoadBtn.disabled = busy; }

function buildSettingsPayload() {
  const pats = {};
  for (const t of TRACK_INFO) pats[t.name] = patterns[t.name].map(v => v ? '1' : '0').join('');
  return {
    version: 1,
    bpm, doubleTime, meter, swing, useFlats,
    preroll: parseInt(prerollSlider.value),
    beatRepeat: beatRepeatValue,
    arpVol: arpVolume,
    tuning: currentTuning,
    rhythmDiff: rhythmDifficulty,
    drumVols: Object.fromEntries(DRUM_VOL_IDS.map(d => [d.name, parseInt($(d.id).value)])),
    scaleEnabled,
    patterns: pats,
    presets,
  };
}
function applySettingsPayload(p) {
  if (!p || typeof p !== 'object') return;
  if (playing) { stopPlayback(); currentStep = 0; playing = false; paused = false; setStartButtonState(false); clearHighlight(); }
  stopPractice();
  if (typeof p.bpm === 'number') { bpm = p.bpm; bpmSpin.value = bpm.toFixed(1); bpmSlider.value = Math.round(bpm * 10); }
  if (typeof p.doubleTime === 'boolean') { doubleTime = p.doubleTime; dtCheck.checked = doubleTime; }
  if (METER_CONFIG[p.meter]) { meter = p.meter; meterCombo.value = meter; engine.seqNumSteps = METER_CONFIG[meter].steps; }
  if (typeof p.swing === 'number') { swing = p.swing; swingSlider.value = swing; swingVal.textContent = swing + '%'; }
  if (typeof p.useFlats === 'boolean') { useFlats = p.useFlats; $('flatsCheck').checked = useFlats; updateFlatsChip(); }
  if (typeof p.preroll === 'number') { prerollSlider.value = p.preroll; prerollValEl.textContent = p.preroll; prerollValue = p.preroll + 1; }
  if (typeof p.beatRepeat === 'number') { beatRepeatValue = p.beatRepeat; beatRepeatSlider.value = beatRepeatValue; beatRepeatValEl.textContent = beatRepeatValue; }
  if (typeof p.arpVol === 'number') { arpVolume = p.arpVol; arpVolSlider.value = p.arpVol; arpVolVal.textContent = p.arpVol.toFixed(2); }
  if (TUNINGS[p.tuning]) { currentTuning = p.tuning; tuningCombo.value = currentTuning; updateTuningNotes(); _fretBase = null; }
  if (RHYTHM_DIFF_IDX[p.rhythmDiff] != null) { rhythmDifficulty = p.rhythmDiff; rhythmDiffCombo.value = rhythmDifficulty; }
  if (p.drumVols) {
    for (const d of DRUM_VOL_IDS) {
      const v = p.drumVols[d.name];
      if (typeof v === 'number') { $(d.id).value = v; $(d.valId).textContent = v; trackVolumes[d.name] = v / 25; }
    }
  }
  if (p.scaleEnabled && typeof p.scaleEnabled === 'object') {
    SCALE_NAMES.forEach(n => { if (typeof p.scaleEnabled[n] === 'boolean') scaleEnabled[n] = p.scaleEnabled[n]; });
    buildScaleToggles();
  }
  if (p.patterns) {
    for (const t of TRACK_INFO) if (typeof p.patterns[t.name] === 'string') patterns[t.name] = strToPattern(p.patterns[t.name]);
  }
  if (Array.isArray(p.presets)) { presets = p.presets; refreshPresetList(); }
  currentStep = 0; prevHighlight = -1;
  buildGrid();
  drawFretboard();
}

function settingsToCSV(payload) {
  const json = JSON.stringify(payload);
  return 'key,value\nconfig,"' + json.replace(/"/g, '""') + '"\n';
}
function csvToSettings(text) {
  // Single-line match only: JSON.stringify never emits raw newlines, and
  // keeping the capture on one line prevents a stray later row from being
  // swallowed by a greedy multiline match.
  const m = text.match(/^config,"([^\n]*)"\s*$/m);
  if (!m) return null;
  return JSON.parse(m[1].replace(/""/g, '"'));
}

async function cloudSave() {
  if (!sb) { setCloudStatus('Supabase SDK not loaded (offline?)', 'err'); return; }
  setCloudBusy(true); setCloudStatus('Saving…', 'busy');
  try {
    const blob = new Blob([settingsToCSV(buildSettingsPayload())], { type: 'text/csv' });
    const { error } = await sb.storage.from(BUCKET).upload(DATA_FILE, blob, { upsert: true, contentType: 'text/csv' });
    if (error) throw error;
    setCloudStatus('Saved to cloud ✓ (' + new Date().toLocaleTimeString() + ')', 'ok');
  } catch (e) {
    console.error('Cloud save failed:', e);
    setCloudStatus('Save failed: ' + (e.message || e), 'err');
  } finally { setCloudBusy(false); }
}
// First-interaction flag: the silent startup load must never clobber a
// session the user has already started (mode running, sliders moved, ...).
let userTouched = false;
['pointerdown', 'keydown'].forEach(ev =>
  window.addEventListener(ev, () => { userTouched = true; }, { capture: true, once: true }));

async function cloudLoad(silent) {
  if (!sb) { if (!silent) setCloudStatus('Supabase SDK not loaded (offline?)', 'err'); return; }
  // Silent startup fetch must not lock the Save/Reload buttons
  if (!silent) { setCloudBusy(true); setCloudStatus('Loading…', 'busy'); }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000); // hung request can't stall the UI
  try {
    const { data: { publicUrl } } = sb.storage.from(BUCKET).getPublicUrl(DATA_FILE);
    const r = await fetch(publicUrl + '?t=' + Date.now(), {
      cache: 'no-store', headers: { 'Cache-Control': 'no-cache, no-store' }, signal: ctrl.signal
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const payload = csvToSettings(await r.text());
    if (!payload) throw new Error('bad file format');
    if (silent && (userTouched || playing || practiceMode)) {
      // User already started interacting — don't stop playback or clobber their changes.
      setCloudStatus('Cloud settings found — press Reload to apply', '');
      return;
    }
    try { applySettingsPayload(payload); }
    catch (e2) {
      console.error('Apply failed:', e2);
      setCloudStatus('Cloud settings could not be fully applied', 'err');
      return;
    }
    setCloudStatus('Settings loaded from cloud ✓', 'ok');
  } catch (e) {
    console.warn('Cloud load:', e);
    if (silent) setCloudStatus('No cloud settings yet — using defaults', '');
    else setCloudStatus('Load failed: ' + (e.message || e), 'err');
  } finally { clearTimeout(timer); if (!silent) setCloudBusy(false); }
}
cloudSaveBtn.addEventListener('click', cloudSave);
cloudLoadBtn.addEventListener('click', () => cloudLoad(false));

// ── Init ───────────────────────────────────────────────────────────
applyDefaultPatterns(); buildGrid(); refreshPresetList(); initStaffCanvas(); buildScaleToggles(); initPracticeCalendar(); updateFlatsChip(); setStartButtonState(false);
updateTuningNotes(); setLayoutMode('horizontal');
window.addEventListener('resize', () => {
  sizeFretCanvas();
  refreshOpenSectionHeights();
  if (practiceMode === 'rhythm' && rhythmState && prerollDone) drawRhythmBar(rhythmState.rhythm, null);
});
cloudLoad(true);
</script>
